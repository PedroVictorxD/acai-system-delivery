spring:
  application:
    name: acai-system

  datasource:
    url: jdbc:postgresql://localhost:5432/acai_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: acai-system-secret-key-change-in-production-min-256-bits-required
  expiration: 86400000
